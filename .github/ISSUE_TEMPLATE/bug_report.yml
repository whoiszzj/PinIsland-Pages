name: Bug 报告
description: 提交你遇到的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈!请尽量详细描述问题,方便我们复现。
        Thanks for reporting! Please describe the issue in as much detail as possible.
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么?你期望的结果是什么?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
  - type: input
    id: app-version
    attributes:
      label: App 版本
      description: 在 App 内 设置 → 关于与支持 底部可以看到版本号
      placeholder: 1.0 (73)
  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: iOS 26.6.1
  - type: textarea
    id: screenshot
    attributes:
      label: 截图(可选)
      description: 可直接粘贴或拖入截图
